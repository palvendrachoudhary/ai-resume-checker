version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # The API will connect to the local free MongoDB container on the docker network
      - MONGO_URI=mongodb://mongodb:27017/smart_ai_recruiter
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - mongodb
      - chromadb
    volumes:
      - ./app:/app

  # 100% FREE Local MongoDB instance
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # 100% FREE Local ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000" # Mapped to 8001 to avoid conflicting with FastAPI on 8000
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
